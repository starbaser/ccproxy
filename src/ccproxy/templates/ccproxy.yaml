%YAML 1.1
---
ccproxy:
  auth:
    command_timeout_seconds: 5
    refresh_headroom_seconds: 60
    refresh_timeout_seconds: 15
  gemini_capacity:
    enabled: true
    fallback_models:
    - gemini-3-flash-preview
    - gemini-2.5-pro
    - gemini-2.5-flash
    retry_status_codes:
    - 429
    - 503
    - 500
    sticky_retry_attempts: 3
    sticky_retry_max_delay_seconds: 60
    terminal_delay_threshold_seconds: 300
    total_retry_budget_seconds: 120
  hooks:
    inbound:
    - ccproxy.hooks.inject_auth
    - ccproxy.hooks.extract_session_id
    - ccproxy.hooks.extract_pplx_files
    - ccproxy.hooks.pplx_thread_inject
    outbound:
    - ccproxy.hooks.gemini_cli
    - ccproxy.hooks.pplx_stamp_headers
    - ccproxy.hooks.pplx_preflight
    - ccproxy.hooks.inject_mcp_notifications
    - ccproxy.hooks.verbose_mode
    - ccproxy.hooks.commitbee_compat
    - ccproxy.hooks.shape
  host: 127.0.0.1
  inspector:
    cert_dir: ~/.config/ccproxy
    port: 8083
  lightllm:
    transforms: []
  log_level: INFO
  mcp:
    buffer:
      max_events_per_task: 65536
      ttl_seconds: 600
    http:
      auth: null
      enabled: true
      host: 127.0.0.1
      port: 4030
  otel:
    enabled: false
    endpoint: http://localhost:4317
    service_name: ccproxy
  port: 4000
  pplx:
    search:
      always_search_override: false
      is_incognito: false
      is_nav_suggestions_disabled: true
      language: en-US
      override_no_search: false
      preflight_timeout_seconds: 5
      search_focus: internet
      search_recency_filter: null
      skip_search_enabled: true
      sources:
      - web
      timezone: America/Los_Angeles
    thread:
      citation_mode: markdown
      consistency_mode: warn
      fetch_page_size: 100
      fetch_timeout_seconds: 10
      ttl_seconds: 1800
    upload:
      fetch_timeout_seconds: 10
      max_file_size_bytes: 52428800
      max_files: 30
      subscribe_timeout_seconds: 120
      upload_timeout_seconds: 60
  provider_max_connections: 256
  providers:
    anthropic:
      auth:
        access_path: claudeAiOauth.accessToken
        expiry_path: claudeAiOauth.expiresAt
        file_path: ~/.claude/.credentials.json
        refresh_path: claudeAiOauth.refreshToken
        type: anthropic_oauth
      base_url: https://api.anthropic.com
      path: /v1/messages
      type: anthropic
    codex:
      auth:
        type: codex_oauth
      base_url: https://chatgpt.com
      path: /backend-api/codex/responses
      type: openai_responses
    deepseek:
      auth:
        command: printenv DEEPSEEK_API_KEY
        header: x-api-key
        type: command
      base_url: https://api.deepseek.com
      path: /anthropic/v1/messages
      type: anthropic
    gemini:
      auth:
        client_id: 
          681255809395-oo8ft2oprdrnp9e3aqf6av3hmdib135j.apps.googleusercontent.com
        client_secret: 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
        type: google_oauth
      base_url: https://cloudcode-pa.googleapis.com
      path: /v1internal:{action}
      type: gemini
    openai_conversations:
      auth:
        cookie_file: ~/.config/ccproxy/openai-conversations-cookies.txt
        file_path: ~/.config/ccproxy/openai-conversations-credentials.json
        type: openai_conversations
      base_url: https://chatgpt.com
      fingerprint_profile: chrome136
      path: /backend-api/f/conversation
      type: openai_conversations
    perplexity_pro:
      auth:
        file: ~/.opnix/secrets/perplexity-pro-api-key
        type: file
      base_url: https://www.perplexity.ai
      fingerprint_profile: chrome131
      path: /rest/sse/perplexity_ask
      type: perplexity_pro
  shaping:
    enabled: true
    providers:
      anthropic:
        capture:
          path_pattern: ^/v1/messages
        content_fields:
        - model
        - messages
        - tools
        - tool_choice
        - system
        - thinking
        - context_management
        - stream
        - max_tokens
        - temperature
        - top_p
        - top_k
        - stop_sequences
        - diagnostics
        - metadata
        merge_strategies:
          system: prepend_shape:2
        preserve_headers:
        - authorization
        - x-api-key
        - x-goog-api-key
        - host
        shape_hooks:
        - ccproxy.shaping.regenerate
        - hook: ccproxy.shaping.caching.strip
          params:
            paths:
            - system.*.cache_control
        - hook: ccproxy.shaping.caching.insert
          params:
            path: system.-1.cache_control
            value:
              type: ephemeral
        strip_headers:
        - authorization
        - x-api-key
        - x-goog-api-key
        - content-length
        - host
        - transfer-encoding
        - connection
        - accept-encoding
      gemini:
        capture:
          path_pattern: '^/v1internal:'
        content_fields:
        - model
        - project
        - user_prompt_id
        preserve_headers:
        - authorization
        - host
        shape_hooks:
        - ccproxy.shaping.regenerate
        - ccproxy.shaping.gemini
        strip_headers:
        - authorization
        - content-length
        - host
        - transfer-encoding
        - connection
        - accept-encoding
      openai_responses:
        capture:
          path_pattern: ^/backend-api/codex/responses
        content_fields:
        - model
        - input
        - tools
        - tool_choice
        - parallel_tool_calls
        - reasoning
        - text
        - stream
        - max_output_tokens
        - temperature
        - top_p
        - metadata
        - client_metadata
        - include
        - previous_response_id
        - prompt_cache_key
        - prompt_cache_retention
        - store
        - truncation
        - service_tier
        - background
        - safety_identifier
        - user
        preserve_headers:
        - authorization
        - chatgpt-account-id
        - x-openai-fedramp
        - host
        shape_hooks:
        - ccproxy.shaping.codex
        strip_headers:
        - authorization
        - chatgpt-account-id
        - x-openai-fedramp
        - content-length
        - content-encoding
        - host
        - transfer-encoding
        - connection
        - accept-encoding
        - x-client-request-id
        - session-id
        - thread-id
        - x-codex-installation-id
        - x-codex-turn-state
        - x-codex-turn-metadata
        - x-codex-parent-thread-id
        - x-codex-window-id
        - x-openai-memgen-request
        - x-openai-subagent
        - openai-organization
        - openai-project
    shapes_dir: ~/.config/ccproxy/shapes
